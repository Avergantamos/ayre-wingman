# Ayre's layer: Star Citizen actions she controls by voice.
# build_layer.py gives each one a spare keyboard combo (kept stable in ayre_keys.json),
# merges them into the pilot's exported profile, and writes her Wingman commands.
# If the pilot already has a keyboard key on an action, she uses that key instead.
#
# name: the command name the model sees. say: instant phrases (skip the model, fastest).
# risky: no instant phrases, and her context tells her to get a spoken yes first.
# Toggles stay with the pilot on the sticks; Ayre gets explicit on/off and set actions.
# assist_only: bound in the profile for her code (assists, screen navigation) but not
# exposed as a voice command. key: press this existing key instead of binding a new one.

"Vehicles - Target Cycling":
  v_target_cycle_attacker_fwd: {name: Next Attacker, say: ["Next attacker"], context: For "who is shooting me" press this, then read the target panel with vision and report ship, pilot, distance, shields and hull}
  v_target_cycle_attacker_back: {name: Previous Attacker}
  v_target_cycle_attacker_reset: {name: Reset Attacker Cycle}
  v_target_cycle_hostile_fwd: {name: Next Hostile, say: ["Next hostile"]}
  v_target_cycle_hostile_back: {name: Previous Hostile}
  v_target_cycle_hostile_reset: {name: Reset Hostile Cycle}
  v_target_cycle_friendly_fwd: {name: Next Friendly}
  v_target_cycle_subitem_fwd: {name: Next Subtarget, context: Cycles the selected ship's components (engines, shields, weapons)}
  v_target_cycle_subitem_reset: {name: Reset Subtarget}
  v_target_pin_selected: {name: Pin Target}
  v_target_remove_all_pins: {name: Clear All Pins}

"Vehicles - Shields and Countermeasures":
  v_weapon_countermeasure_decoy_launch: {name: Launch Flares, say: ["Flares"]}
  v_weapon_countermeasure_noise_launch: {name: Launch Noise, say: ["Noise", "Chaff"]}
  v_weapon_countermeasure_decoy_launch_panic: {name: Dump Flares, say: ["Dump flares"]}
  v_weapon_countermeasure_decoy_burst_increase: {name: Bigger Flare Bursts}
  v_weapon_countermeasure_decoy_burst_decrease: {name: Smaller Flare Bursts}

"Flight - Quantum Travel":
  v_set_quantum_mode: {name: Quantum Mode}
  v_toggle_qdrive_engagement: {name: Engage Quantum Drive, risky: true}
  v_master_mode_set_nav: {name: NAV Mode}
  v_master_mode_set_scm: {name: SCM Mode, say: ["SCM mode", "Combat mode"]}

"Vehicles - Weapons":
  v_set_guns_mode: {name: Guns Mode}
  v_weapon_preset_guns0: {name: All Weapons, context: First group always holds every weapon. Selects without firing}
  v_weapon_preset_guns1: {name: Weapon Group 2, context: Ayre arranges groups 2 to 4 by weapon type at boot. Selects without firing}
  v_weapon_preset_guns2: {name: Weapon Group 3, context: Ayre arranges groups 2 to 4 by weapon type at boot. Selects without firing}
  v_weapon_preset_guns3: {name: Weapon Group 4, context: Ayre arranges groups 2 to 4 by weapon type at boot. Selects without firing}
  v_weapon_gimbals_state_set_locked: {name: Lock Gimbals}
  v_weapon_gimbals_state_set_unlocked: {name: Unlock Gimbals}
  v_weapon_staggered_fire_on: {name: Staggered Fire On}
  v_weapon_staggered_fire_off: {name: Staggered Fire Off}
  v_weapon_convergence_distance_set_default: {name: Reset Convergence}
  v_weapon_preset_qid_jammer: {name: Quantum Jammer, context: Quantum interdiction jammer}
  v_weapon_preset_qid_pulse: {name: Quantum Pulse, context: Quantum interdiction pulse, pulls ships out of quantum}

"Vehicles - Missiles":
  v_set_missile_mode: {name: Missile Mode, say: ["Missile mode"]}
  v_weapon_cycle_missile_fwd: {name: Next Missile Type}
  v_weapon_cycle_missile_back: {name: Previous Missile Type}
  v_weapon_increase_max_missiles: {name: More Missiles Per Volley}
  v_weapon_decrease_max_missiles: {name: Fewer Missiles Per Volley}

