  v_strafe_back: {name: Strafe Back, assist_only: true, key: s}
  v_strafe_left: {name: Strafe Left, assist_only: true, key: a}
  v_strafe_right: {name: Strafe Right, assist_only: true, key: d}
  v_strafe_up: {name: Strafe Up, assist_only: true, key: space}
  v_strafe_down: {name: Strafe Down, assist_only: true}
  v_pitch_up: {name: Pitch Up, assist_only: true}
  v_pitch_down: {name: Pitch Down, assist_only: true}
  v_yaw_left: {name: Yaw Left, assist_only: true}
  v_yaw_right: {name: Yaw Right, assist_only: true}
